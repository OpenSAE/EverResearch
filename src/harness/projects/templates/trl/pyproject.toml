"trl.experimental.cpo" = "tasks/experimental/contrastive_preference_optimization"
"trl.experimental.cpo.cpo_config" = "tasks/experimental_parameters/contrastive_preference_optimization"
"trl.experimental.gkd" = "tasks/experimental/generalized_distillation"
"trl.experimental.gkd.gkd_config" = "tasks/experimental_parameters/generalized_distillation"
