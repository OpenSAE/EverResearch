[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "trl"
description = "Train transformer language models with reinforcement learning."
authors = [
    { name = "Leandro von Werra", email = "leandro.vonwerra@gmail.com" }
]
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "transformers", "huggingface", "language modeling", "post-training", "rlhf", "sft", "dpo", "grpo"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.7.0",  # Support Json type and on_mixed_types="use_json"
    "huggingface_hub>=0.34.0",
    "jinja2",
    "numpy>=1.26.0",
    "packaging>20.0",
    "pandas>=2.1.1",
    "psutil>=5.9.4",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0.1",
    "torch>=2.6.0",  # torch.accelerator, and the public FSDP2 API
    "transformers>=4.56.2",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/huggingface/trl"

[project.scripts]
trl = "trl.cli:main"

[project.optional-dependencies]
deepspeed = [
    "deepspeed>=0.18.6",
    "transformers!=5.1.0",  # see transformers#43780
]
harbor = [
    "harbor>=0.13.0; python_version >= '3.12'",  # harbor requires Python 3.12+ (pulls its sandbox backends)
]
kernels = [  # transformers renamed the "hub-kernels" extra to "kernels" in 5.1.0
    "transformers[kernels]",  # transformers >= 5.1.0
    "transformers[hub-kernels]",  # transformers < 5.1.0
]
liger = [  # removed in v2.0.0, together with `use_liger_kernel`
    "liger-kernel>=0.8.2"
]
math_verify = [
    "math-verify>=0.8.0",  # timeouts can be disabled, which worker threads require
]
openreward = [
    "openreward>=0.1.109",
]
peft = [
    "peft>=0.18.0"
]
quality = [
    "pre-commit",
    "hf-doc-builder"
]
quantization = [
    "bitsandbytes>=0.45.2"  # older versions fail to import without a GPU on torch 2.6/2.7 (Triton 3.2/3.3), see #7863
]
test = [
    "pytest-cov",
    "pytest-datadir>=1.7.0",  # lazy datadirs
    "pytest-rerunfailures>=16.7",  # only_rerun matches wrapped exceptions
    "pytest-xdist",
    "pytest",
]
vllm = [
    "vllm>=0.23.0,<0.35.0",
    "aiohttp>=3.13.3",
    "requests",
]
vlm = [
    "Pillow",
    "torchvision",
    "num2words==0.5.14"
]
dev = [
    # deepspeed
    "deepspeed>=0.18.6",
    # kernels: transformers renamed the "hub-kernels" extra to "kernels" in 5.1.0
    "transformers[kernels]",  # transformers >= 5.1.0
    "transformers[hub-kernels]",  # transformers < 5.1.0
    # math_verify
    "math-verify>=0.8.0",  # timeouts can be disabled, which worker threads require
    # openreward
    "openreward>=0.1.109",
    # peft
    "peft>=0.18.0",
    # quality
    "pre-commit",
    "hf-doc-builder",
    # quantization
    "bitsandbytes>=0.45.2",  # older versions fail to import without a GPU on torch 2.6/2.7 (Triton 3.2/3.3), see #7863
    # test
    "pytest-cov",
    "pytest-datadir>=1.7.0",  # lazy datadirs
    "pytest-rerunfailures>=16.7",  # only_rerun matches wrapped exceptions
    "pytest-xdist",
    "pytest",
    # vllm: not included in dev by default due to CUDA error; see GH-4228. The async rollout workers only need aiohttp
    "aiohttp>=3.13.3",
    # vlm
    "Pillow",
    "torchvision",
    "num2words==0.5.14",
    # for response parsing (required for training with tools)
    "jmespath",
]

[tool.setuptools]
packages = [
    "trl",
    "trl.experimental.a2po.a2po_config",
    "trl.experimental.a2po.a2po_trainer",
    "trl.experimental.cpo.cpo_config",
    "trl.experimental.gkd.gkd_config",
    "trl.experimental.gmpo.gmpo_config",
    "trl.experimental.iw_opd.iw_opd_config",
    "trl.experimental.orpo.orpo_config",
    "trl.experimental.sdft.sdft_config",
    "trl.experimental.sdpo.sdpo_config",
    "trl.experimental.utils",
    "trl.kernels.chunked_logprob",
    "trl.kernels.tree_mamba2",
    "trl.models.utils",
    "trl.scripts.dpo",
    "trl.scripts.env",
    "trl.scripts.grpo",
    "trl.scripts.kto",
    "trl.scripts.rloo",
    "trl.scripts.sft",
    "trl.scripts.utils",
    "trl.trainer.utils",
    "trl.accelerate_configs",
    "trl.chat_templates",
    "trl.cli",
    "trl.cli.commands",
    "trl.data_utils",
    "trl.experimental",
    "trl.experimental.a2po",
    "trl.experimental.async_distillation",
    "trl.experimental.async_grpo",
    "trl.experimental.bema_for_ref_model",
    "trl.experimental.cpo",
    "trl.experimental.distillation",
    "trl.experimental.gkd",
    "trl.experimental.gmpo",
    "trl.experimental.gold",
    "trl.experimental.harbor",
    "trl.experimental.iw_opd",
    "trl.experimental.kto",
    "trl.experimental.online_dpo",
    "trl.experimental.openreward",
    "trl.experimental.orpo",
    "trl.experimental.sdft",
    "trl.experimental.sdpo",
    "trl.experimental.server_distillation",
    "trl.extras",
    "trl.generation",
    "trl.kernels",
    "trl.models",
    "trl.precheck",
    "trl.rewards",
    "trl.scripts",
    "trl.templates",
    "trl.trainer",
    "trl.trainer.async_grpo_config",
    "trl.trainer.base_config",
    "trl.trainer.distillation_config",
    "trl.trainer.dpo_config",
    "trl.trainer.grpo_config",
    "trl.trainer.kto_config",
    "trl.trainer.model_config",
    "trl.trainer.reward_config",
    "trl.trainer.rloo_config",
    "trl.trainer.sft_config",
]

