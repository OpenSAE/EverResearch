name: Check FastVLM inference interfaces

on: [push, pull_request]

jobs:
  command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest Pillow
      - run: python -m pytest -q
