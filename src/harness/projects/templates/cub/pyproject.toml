# Purpose and main function: definition of installation and command entry for reference classification items.
# Scope of application: independent installation of templates and running of local engineering checks.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rh-cub-template"
version = "0.1.0"
description = "EverResearch reference project for CUB-200 image classification"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "torchvision>=0.17", "Pillow>=10", "hydra-core>=1.3,<2"]

[project.scripts]
cub-template = "cub_template.command:main"

[tool.setuptools]
packages = ["cub_template", "cub_template.runtime", "cub_template.datasets", "cub_template.datasets.cub200", "cub_template.models", "cub_template.models.residual", "cub_template.models.residual.residual18", "cub_template.models.convolution", "cub_template.models.convolution.small_cnn", "cub_template.tasks", "cub_template.tasks.classification", "cub_template.tasks.precheck"]

[tool.setuptools.package-dir]
cub_template = "base/cub_template"
"cub_template.datasets" = "datasets"
"cub_template.models" = "models"
"cub_template.tasks" = "tasks"

[tool.pytest.ini_options]
pythonpath = ["base"]
