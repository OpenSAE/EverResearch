# Purpose: By generated RGB The same sorting process after an open exercise with a new model.
# Scope of application: Offline CPU Check. The product is clearly marked. synthetic.
[dataset]
name = "synthetic"
image_size = 32

[model]
name = "small_cnn"
channels = 16

[task]
name = "classification"

[training]
epochs = 1
batch_size = 2
learning_rate = 0.001
seed = 42

[runtime]
device = "cpu"
workers = 0
cpu_threads = 2

[precheck]
samples = 2

[benchmark]
samples = 4
warmup = 1
repeats = 3
