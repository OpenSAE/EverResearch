# 目的：声明 CUB-200-2011 官方划分上的 ResNet18 + MLP 分类基线。
# 适用范围：本地已准备数据的正式训练和运行前检查。
[dataset]
name = "cub200"
root = "../../../../../data/CUB_200_2011"
image_size = 224

[model]
name = "resnet18_mlp"
hidden_dim = 256

[training]
epochs = 30
batch_size = 32
learning_rate = 0.001
seed = 42

[runtime]
device = "auto"
workers = 2
cpu_threads = 4

[precheck]
samples = 2

[benchmark]
samples = 32
warmup = 1
repeats = 3
