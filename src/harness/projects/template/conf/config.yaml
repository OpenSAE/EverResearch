# 目的和主要功能：在一份配置中维护项目默认值和可选组件。
# 适用范围：新实验从此开始，单次运行的生效配置保存到 experiment/。
defaults:
  - dataset: cub200
  - model: resnet18_mlp
  - task: classification
  - _self_

catalogs:
  dataset:
    cub200:
      name: cub200
      image_size: 224
      root: ../data/CUB_200_2011
    synthetic:
      name: synthetic
      image_size: 32
  model:
    resnet18_mlp:
      name: resnet18_mlp
    resnet18_mlp_small:
      name: resnet18_mlp_small
    small_cnn:
      name: small_cnn
  task:
    classification:
      name: classification
    precheck:
      name: precheck
      target: classification

runtime:
  device: auto
  workers: 2
  cpu_threads: 4
training:
  seed: 42
  batch_size: 32
  epochs: 30
  learning_rate: 0.001
precheck:
  samples: 2
benchmark:
  samples: 32
  warmup: 1
  repeats: 3
  max_cuda_memory_fraction: 0.9
