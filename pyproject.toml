# 目的和主要功能：声明 ResearchHarness 的包元数据、构建后端、依赖、CLI 入口、
# 包资源及开发工具配置。
# 适用范围：供安装、打包和显式调用开发工具时读取；不保存项目科研输入或本机绑定，
# 不因配置了测试和检查工具而自动执行验证。

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchharness"
version = "0.2.0"
description = "Local research project bindings, shared skills, and utilities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2", "ruff==0.15.22"]

[project.scripts]
rh = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]
namespaces = false

[tool.setuptools.package-data]
harness = ["projects/*.yaml", "projects/*.md", "core/*.md", "utils/*.md", "utils/transfer/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
