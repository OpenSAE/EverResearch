# Purpose and main function: declaration ResearchHarness package metadata, build backend, depend on, CLI Access.,
# Package resource and development tool configuration.
# Scope of application: For reading during installation, packing and visible call development tool; not to save project scientific input or institutional binding,
# No auto-validation due to the configuration of testing and inspection tools.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchharness"
version = "0.2.0"
description = "Local research project bindings, shared skills, and utilities"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6,<7", "pyspellchecker>=0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2", "ruff==0.15.22"]

[project.scripts]
rh = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]
namespaces = false

[tool.setuptools.package-data]
harness = ["projects/*.yaml", "projects/*.md", "projects/*.md.in", "core/*.md", "utils/*.md", "utils/transfer/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = [
    "src/harness/core",
    "src/harness/projects/test_project_operations.py",
    "src/harness/utils",
]
pythonpath = ["src"]
