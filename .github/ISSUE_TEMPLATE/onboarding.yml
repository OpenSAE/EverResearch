# Purpose: collect reproducible reports about project onboarding.
# Scope: help maintainers diagnose project check and adoption behavior.
name: Project onboarding
description: Report a problem checking or adopting a research project.
title: "[Onboarding] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
      description: Describe the project and the paths the report missed or classified incorrectly.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Project check output
      description: Paste the relevant part of the output from rh projects project check. Replace any private paths or project names before posting.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, and EverResearch versions
      description: You can find the EverResearch and Python versions with rh doctor.
