# Purpose: publish verified installer files as versioned GitHub Release assets.
# Scope: migrate the published installers on setup and build new releases on request.
name: Publish installers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-installers.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: everresearch-installer-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'OpenSAE/EverResearch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Migrate historical installers
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 src/harness/utils/release/publish_installers.py --migrate
      - name: Build and verify installers
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          pipx install uv
          uv run --no-project --python 3.12 --with PyYAML --with filelock --with platformdirs \
            env PYTHONPATH=src python -m harness.cli utils release \
            --source . --output "$RUNNER_TEMP/everresearch"
          uv run --no-project --python 3.12 python "$RUNNER_TEMP/everresearch/verify.py" \
            "$RUNNER_TEMP/everresearch"
      - name: Publish the verified build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          python3 src/harness/utils/release/publish_installers.py \
            --source "$RUNNER_TEMP/everresearch" --version "$version" --target "$GITHUB_SHA"
