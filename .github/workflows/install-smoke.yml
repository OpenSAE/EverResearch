# Purpose: verify the first-run CLI experience from a clean installation.
# Scope: exercise the installed CLI and research demo on each desktop OS.
name: First-run smoke tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: rh doctor --json
      - run: rh utils quick-demo .smoke-demo
      - run: rh projects project check .smoke-demo/MixedStudy
      - run: rh projects project check --json .smoke-demo/SignalStudy
      - name: Install the native Codex plugin
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npx --yes --package @openai/codex@0.171.0 codex plugin marketplace add OpenSAE/EverResearch
          npx --yes --package @openai/codex@0.171.0 codex plugin add ever-research@ever-research
      - name: Install and run the portable skills for Cursor
        if: runner.os == 'Linux'
        shell: bash
        working-directory: .smoke-demo/MixedStudy
        run: |
          npx --yes skills@1.9.0 add https://github.com/OpenSAE/EverResearch/tree/main/plugins/agent-plugin --agent cursor --all -y
          python -I .agents/skills/maintain-project/scripts/rh.py doctor --json
