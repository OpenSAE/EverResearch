# Purpose: verify the first-run CLI experience from a clean installation.
# Scope: test released packages and marketplace pins on each desktop OS.
name: First-run smoke tests

on:
  push:
    branches: [main]
    paths: ['plugins/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the released package from GitHub Releases
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as config:
              version = tomllib.load(config)["project"]["version"]
          filename = f"ever_research-{version}-py3-none-any.whl"
          url = f"https://github.com/OpenSAE/EverResearch/releases/download/v{version}/{filename}"
          subprocess.run([sys.executable, "-m", "pip", "install", url], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              print(f"EVER_RESEARCH_RELEASE={version}", file=environment)
          PY
      - run: rh doctor --json
      - run: rh utils quick-demo .smoke-demo
      - run: rh projects project check .smoke-demo/MixedStudy
      - run: rh projects project check --json .smoke-demo/SignalStudy
      - name: Check maintenance routing on the installed CLI
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess

          project = ".smoke-demo/MixedStudy"
          command = ["rh", "projects", "project", "status", project]
          assert json.loads(subprocess.check_output(command))["state"] == "unmanaged"
          subprocess.run(["rh", "projects", "setup-maintenance", project], check=True)
          status = json.loads(subprocess.check_output(command))
          assert (status["state"], status["mode"]) == ("managed", "offline")
          PY
      - name: Verify the released wheel and marketplace pins
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          version = os.environ["EVER_RESEARCH_RELEASE"]
          filename = f"ever_research-{version}-py3-none-any.whl"
          release = f"https://github.com/OpenSAE/EverResearch/releases/download/v{version}"
          with urlopen(f"{release}/SHA256SUMS", timeout=30) as response:
              checksums = dict(line.split(maxsplit=1)[::-1] for line in response.read().decode().splitlines())
          with urlopen(f"{release}/{filename}", timeout=30) as response:
              payload = response.read()
          digest = sha256(payload).hexdigest()
          assert digest == checksums[filename]
          platforms = ["agent-plugin", "claude-plugin", "codex-plugin", "cursor-plugin",
                       "deepseek", "gemini-extension", "openclaw", "opencode"]
          for platform in platforms:
              pins = list((Path("plugins") / platform).glob("skills/*/scripts/rh-runtime.json"))
              assert pins, f"No runtime pins for {platform}"
              for pin in pins:
                  assert json.loads(pin.read_text()) == {
                      "filename": filename, "sha256": digest, "size": len(payload)
                  }, f"Stale runtime pin: {pin}"
          PY
      - name: Install the native Codex plugin
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npx --yes --package @openai/codex@0.171.0 codex plugin marketplace add OpenSAE/EverResearch
          npx --yes --package @openai/codex@0.171.0 codex plugin add ever-research@ever-research
      - name: Install and run the portable skills for Cursor
        if: runner.os == 'Linux'
        shell: bash
        working-directory: .smoke-demo/MixedStudy
        run: |
          npx --yes skills@1.9.0 add https://github.com/OpenSAE/EverResearch/tree/main/plugins/agent-plugin --agent cursor --all -y
          python -I .agents/skills/maintain-project/scripts/rh.py doctor --json > health.json
          python -c 'import json, os; assert json.load(open("health.json"))["version"] == os.environ["EVER_RESEARCH_RELEASE"]'
