# Purpose: verify the first-run CLI experience from a clean installation.
# Scope: exercise the installed CLI and research demo on each desktop OS.
name: First-run smoke tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: rh doctor --json
      - run: rh utils quick-demo .smoke-demo
      - run: rh projects project check .smoke-demo/MixedStudy
      - run: rh projects project check --json .smoke-demo/SignalStudy
